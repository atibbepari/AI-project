<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fridge Chef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EC;
    --ink:#20301F;
    --paper:#FFFFFF;
    --sage:#4C7A45;
    --sage-dark:#345730;
    --yolk:#E7B227;
    --line:#E4DCC8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2rem,4vw,2.8rem);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{margin:0;color:#5C6B54;font-size:1.02rem;max-width:52ch;}
  .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;}
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  label{display:block;font-weight:600;font-size:0.92rem;margin-bottom:8px;}
  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-family:inherit;
    font-size:0.98rem;
    line-height:1.5;
    color:var(--ink);
    background:#FFFDF8;
  }
  textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}
  .hint{font-size:0.82rem;color:#8A8570;margin-top:6px;}
  .buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.94rem;
    border-radius:9px;
    padding:11px 18px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.55;cursor:default;transform:none;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--sage-dark);}
  .btn-surprise{background:var(--yolk);color:#3A2A05;}
  .btn-surprise:hover:not(:disabled){filter:brightness(0.95);}
  .result-panel{display:flex;flex-direction:column;min-height:340px;}
  .empty{
    margin:auto;
    text-align:center;
    color:#9A9377;
    font-size:0.96rem;
    padding:20px;
  }
  .empty span{display:block;font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink);margin-bottom:6px;}
  .loading{margin:auto;text-align:center;color:#5C6B54;font-size:0.95rem;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin:0 3px;animation:bounce 1.1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;}
  .dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-6px);opacity:1;}}
  .dish-name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.7rem;
    margin:0 0 4px;
  }
  .tag{
    display:inline-block;
    font-size:0.78rem;
    font-weight:600;
    color:var(--sage-dark);
    background:#EEF3E9;
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:14px;
  }
  h3{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#8A8570;
    margin:18px 0 8px;
  }
  ul.pills{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px;}
  ul.pills li{
    background:#F3EFE2;
    border:1px solid var(--line);
    padding:5px 11px;
    border-radius:20px;
    font-size:0.86rem;
  }
  ol.steps{padding-left:20px;margin:0;}
  ol.steps li{margin-bottom:10px;line-height:1.5;font-size:0.96rem;}
  .error{color:#A33D2E;font-size:0.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fridge Chef</h1>
    <p>Tell it what's in your fridge and pantry. It'll find one dish worth making.</p>
  </header>
  <div class="grid">
    <div class="panel">
      <label for="ingredients">What do you have?</label>
      <textarea id="ingredients" placeholder="e.g. eggs, spinach, half an onion, feta, stale bread, garlic"></textarea>
      <p class="hint">List anything — staples like salt, oil and pepper are assumed.</p>
      <div class="buttons">
        <button class="btn-primary" id="suggestBtn">Suggest a dish</button>
        <button class="btn-surprise" id="surpriseBtn">🎲 Surprise me</button>
      </div>
    </div>
    <div class="panel result-panel" id="resultPanel">
      <div class="empty" id="emptyState">
        <span>Nothing cooking yet</span>
        Add your ingredients and press a button.
      </div>
    </div>
  </div>
</div>

<script>
const ingredientsEl = document.getElementById('ingredients');
const resultPanel = document.getElementById('resultPanel');
const suggestBtn = document.getElementById('suggestBtn');
const surpriseBtn = document.getElementById('surpriseBtn');

function setLoading(){
  resultPanel.innerHTML = '<div class="loading">Thinking up something good<br><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
}

function setError(msg){
  resultPanel.innerHTML = '<div class="empty"><span>Could not find a dish</span><p class="error">'+msg+'</p></div>';
}

function render(data){
  const usedPills = data.ingredients_used.map(i => '<li>'+i+'</li>').join('');
  const extraPills = data.extras_needed && data.extras_needed.length
    ? data.extras_needed.map(i => '<li>'+i+'</li>').join('')
    : '<li>Nothing else — you are set</li>';
  const steps = data.steps.map(s => '<li>'+s+'</li>').join('');
  resultPanel.innerHTML = `
    <span class="tag">${data.tag || 'Suggested dish'}</span>
    <h2 class="dish-name">${data.dish}</h2>
    <p>${data.description || ''}</p>
    <h3>Uses from your list</h3>
    <ul class="pills">${usedPills}</ul>
    <h3>You'll also need</h3>
    <ul class="pills">${extraPills}</ul>
    <h3>Steps</h3>
    <ol class="steps">${steps}</ol>
  `;
}

async function getDish(surprise){
  const raw = ingredientsEl.value.trim();
  if(!raw){
    setError('Add a few ingredients first.');
    return;
  }
  setLoading();
  suggestBtn.disabled = true;
  surpriseBtn.disabled = true;

  const styleInstruction = surprise
    ? 'Pick something unexpected, adventurous or a bit more elevated than an obvious weeknight meal — surprise the cook while still being realistically makeable.'
    : 'Pick the most sensible, satisfying dish for a normal weeknight, mostly using what they listed.';

  const prompt = `You are Fridge Chef, helping someone cook using mostly what they already have.
Ingredients on hand: ${raw}

${styleInstruction}
Assume basic staples (salt, pepper, oil, water) are available even if not listed.

Respond with ONLY valid JSON, no markdown fences, no preamble, matching exactly this shape:
{
  "dish": "Name of the dish",
  "tag": "one short word or phrase describing the vibe, e.g. 'Comfort food' or 'Weeknight fast'",
  "description": "One appetising sentence about the dish.",
  "ingredients_used": ["ingredient1", "ingredient2"],
  "extras_needed": ["thing you'd need to buy or don't have"],
  "steps": ["step one", "step two", "step three"]
}
Keep ingredients_used limited to items actually from their list. Keep extras_needed short (0-4 items). Keep steps clear and concise (4-7 steps).`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('No response received.');
    const cleaned = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    render(parsed);
  }catch(err){
    console.error(err);
    setError('Something went wrong — try again.');
  }finally{
    suggestBtn.disabled = false;
    surpriseBtn.disabled = false;
  }
}

suggestBtn.addEventListener('click', () => getDish(false));
surpriseBtn.addEventListener('click', () => getDish(true));
</script>
</body>
</html>
